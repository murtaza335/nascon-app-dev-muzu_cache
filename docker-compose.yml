# Grader runs this file as-is. No host-specific values.
# Every variable has a ${VAR:-default}; this file must work with no .env present.
# Core services: backend, postgres, redis. Optional services below are commented out.
name: nascon

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Cache-only config: no persistence, bounded memory, evicts only keys that carry a TTL
    # (all cache keys do). If Redis is later also used for sessions or queues, keep those
    # keys TTL-less or use a second instance.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    # Error format and strict input validation: see backend/src/errors.js and validate.js (ADR-004).
    # Redis cache-aside with version-key invalidation: see backend/src/cache.js (ADR-003).
    # Config here must work with no .env file.
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DAY1_SALT: ${DAY1_SALT}
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
      REDIS_URL: redis://redis:6379
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      CACHE_TIMEOUT_MS: ${CACHE_TIMEOUT_MS:-200}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 rather than localhost: busybox wget may resolve localhost to ::1 first.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Optional services. Uncomment only if the spec needs them; add the backend
  # depends_on entry and env vars too. Use service names, never localhost.
  # ---------------------------------------------------------------------------

