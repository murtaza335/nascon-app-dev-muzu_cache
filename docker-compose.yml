# Grader runs this file as-is. No host-specific values.
# Every variable has a ${VAR:-default} except DAY1_SALT, which the grader supplies in the environment (never committed).
# Services: postgres, redis, minio, backend (API on host port 8080), worker (outbox relay, consumer, receipt archive).
name: nascon

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Cache-only config: no persistence, bounded memory, evicts only keys that carry a TTL
    # (all cache keys do). If Redis is later also used for sessions or queues, keep those
    # keys TTL-less or use a second instance.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    # Receipt PDF archive (worker only). The API does not depend on it, so /health is never delayed by object storage.
    # quay.io: Docker Hub no longer serves this tag ("pull access denied").
    image: quay.io/minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    # Error format and strict input validation: backend/src/errors.js and lib/validate.js (ADR-003).
    # Redis cache-aside with version-key invalidation: backend/src/cache.js (ADR-004).
    # Config here must work with no .env file except DAY1_SALT, which the grader supplies in the environment.
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      NODE_ENV: production
      DAY1_SALT: ${DAY1_SALT}
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
      REDIS_URL: redis://redis:6379
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      CACHE_TIMEOUT_MS: ${CACHE_TIMEOUT_MS:-200}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      MOCK_GATEWAY_LATENCY_MS: ${MOCK_GATEWAY_LATENCY_MS:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 rather than localhost: busybox wget may resolve localhost to ::1 first.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  worker:
    # Same image as the API: transactional-outbox relay → Redis Stream, consumer group, receipt archive to MinIO.
    build: ./backend
    command: ["node", "src/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET_RECEIPTS: ${S3_BUCKET_RECEIPTS:-receipts}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      # The worker touches /tmp/worker.heartbeat every 5 s; unhealthy when it is older than 30 s.
      test: ["CMD-SHELL", "test -f /tmp/worker.heartbeat && [ $$(( $$(date +%s) - $$(stat -c %Y /tmp/worker.heartbeat) )) -lt 30 ]"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
