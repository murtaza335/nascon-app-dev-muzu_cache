# Grader runs this file as-is. No host-specific values.
# Every variable has a ${VAR:-default} except DAY1_SALT, which the grader supplies in the environment (never committed).
# Services: postgres, redis, objectstore (S3), backend (API on host port 8080), worker (outbox relay, consumer, receipt archive).
name: nascon

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Cache-only config: no persistence, bounded memory, evicts only keys that carry a TTL
    # (all cache keys do). If Redis is later also used for sessions or queues, keep those
    # keys TTL-less or use a second instance.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  objectstore:
    # S3-compatible receipt archive (worker only): our own small server (backend/src/objectstore.js) from the same image
    # as the API. MinIO no longer publishes images, and the alternatives are ~1 GB downloads. Archived PDFs are copies;
    # the receipt of record is in PostgreSQL. The API does not depend on it, so /health is never delayed by it.
    image: nascon-backend:local
    command: ["node", "src/objectstore.js"]
    environment:
      OBJECT_DIR: /data
      OBJECTSTORE_PORT: 4566
    volumes:
      - objects:/data
    depends_on:
      backend:
        condition: service_started   # only so compose builds and tags the shared image first
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4566/_health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    # Builds and tags the one image shared by backend, worker and objectstore.
    # Error format and strict input validation: backend/src/errors.js and lib/validate.js (ADR-003).
    # Redis cache-aside with version-key invalidation: backend/src/cache.js (ADR-004).
    # Config here must work with no .env file except DAY1_SALT, which the grader supplies in the environment.
    build: ./backend
    image: nascon-backend:local
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      NODE_ENV: production
      DAY1_SALT: ${DAY1_SALT}
      DAY2_SALT: ${DAY2_SALT}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      PUBLIC_MEDIA_HOST: ${PUBLIC_MEDIA_HOST:-localhost}
      MEDIA_API_URL: http://media:9997
      MEDIA_HOOK_TOKEN: ${MEDIA_HOOK_TOKEN:-media-hook-dev}
      DLQ_BACKOFF_MS: ${DLQ_BACKOFF_MS:-5}
      GUEST_TOKEN_TTL_SECONDS: ${GUEST_TOKEN_TTL_SECONDS:-7200}
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
      REDIS_URL: redis://redis:6379
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      CACHE_TIMEOUT_MS: ${CACHE_TIMEOUT_MS:-200}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      MOCK_GATEWAY_LATENCY_MS: ${MOCK_GATEWAY_LATENCY_MS:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      media:
        condition: service_healthy   # /health verifies the media server (Part II spec §5.2)
    healthcheck:
      # 127.0.0.1 rather than localhost: busybox wget may resolve localhost to ::1 first.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  media:
    # MediaMTX 1.9.1 in a wrapper image (D2-ADR-02): RTMP 1935, HLS 8888, WebRTC WHIP/WHEP 8889 (+8189/udp ICE), API 9997 (internal).
    build:
      context: ./media
      args:
        WITH_FFMPEG: ${MEDIA_WITH_FFMPEG:-true}
    image: nascon-media:local
    ports:
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
      - "8189:8189/udp"
    environment:
      MEDIA_HOOK_TOKEN: ${MEDIA_HOOK_TOKEN:-media-hook-dev}
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIA_WEBRTC_HOSTS:-}
    volumes:
      - recordings:/recordings
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9997/v3/paths/list > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    restart: unless-stopped

  selenium-hub:
    # Selenium Grid 4 (QA-01). Local machines without the 4.25.0 images: SELENIUM_TAG=4.24.0.
    image: selenium/hub:${SELENIUM_TAG:-4.25.0}
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:4444/status | grep -q '\"ready\": *true'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  node-chrome-1:
    image: selenium/node-chrome:${SELENIUM_TAG:-4.25.0}
    shm_size: "1gb"
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment: &selenium_node_env
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 2
      SE_START_VNC: "false"
      SE_START_NO_VNC: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:5555/status > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  node-chrome-2:
    image: selenium/node-chrome:${SELENIUM_TAG:-4.25.0}
    shm_size: "1gb"
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment: *selenium_node_env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:5555/status > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  node-firefox:
    image: selenium/node-firefox:${SELENIUM_TAG:-4.25.0}
    shm_size: "1gb"
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment: *selenium_node_env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:5555/status > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  worker:
    # Same image as the API: transactional-outbox relay → Redis Stream, consumer group, receipt archive.
    image: nascon-backend:local
    command: ["node", "src/worker.js"]
    environment:
      NODE_ENV: production
      DAY2_SALT: ${DAY2_SALT}
      MEDIA_API_URL: http://media:9997
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://objectstore:4566
      S3_BUCKET_RECEIPTS: ${S3_BUCKET_RECEIPTS:-receipts}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      objectstore:
        condition: service_started   # archive retries with backoff; never block the worker on it
      backend:
        condition: service_healthy
    healthcheck:
      # The worker touches /tmp/worker.heartbeat every 5 s; unhealthy when it is older than 30 s.
      test: ["CMD-SHELL", "test -f /tmp/worker.heartbeat && [ $$(( $$(date +%s) - $$(stat -c %Y /tmp/worker.heartbeat) )) -lt 30 ]"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
  objects:
  recordings:
