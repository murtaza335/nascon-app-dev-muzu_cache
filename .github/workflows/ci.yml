# Mirror of the assumed autograder: cold `docker compose up` on ubuntu-latest, then HTTP tests.
# The real grader may differ; keep this green so surprises are limited to the spec itself.
name: grade

on:
  push:
  workflow_dispatch:

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Contract checks
        run: |
          docker compose config -q
          if grep -nE ':latest' docker-compose.yml; then echo "::error::':latest' tag in docker-compose.yml"; exit 1; fi
          if grep -nE '^\s*container_name:' docker-compose.yml; then echo "::error::container_name is forbidden"; exit 1; fi
          nested="$(find . -name .git -not -path './.git' -prune)"
          if [ -n "$nested" ]; then echo "::error::nested git repo(s): $nested"; exit 1; fi
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then echo "::error::.env is tracked"; exit 1; fi
          chmod +x scripts/*.sh

      - name: Cold start like the grader
        run: docker compose up --build -d --wait

      - name: Wait for health
        run: ./scripts/wait-for-health.sh http://localhost:8080/health 90

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install -r tests/requirements.txt

      - name: Backend tests
        working-directory: backend
        run: npm test

      - name: API tests
        working-directory: tests
        run: pytest api -m "not destructive"

      # - name: Selenium smoke (ui profile)
      #   run: |
      #     docker compose -f docker-compose.yml -f docker-compose.test.yml --profile ui up -d --wait
      #     cd tests && pytest e2e-web

      # - name: k6 smoke
      #   run: docker compose -f docker-compose.yml -f docker-compose.test.yml --profile perf run --rm k6

      - name: Collect compose logs
        if: always()
        run: |
          mkdir -p reports
          docker compose logs --no-color > reports/compose.log 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: reports/

      - name: Tear down
        if: always()
        run: docker compose down -v
