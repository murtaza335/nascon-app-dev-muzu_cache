[pytest]
addopts = -ra --import-mode=importlib --alluredir=../reports/allure-results --html=../reports/report.html --self-contained-html
markers =
    req(id): requirement ID covered by the test (see TRACEABILITY.md)
    api: HTTP API tests against the running backend
    web: Selenium browser tests (needs the ui profile)
    mobile: Appium tests (needs a phone and an Appium server)
    destructive: stops/starts compose services; runs only with RUN_DESTRUCTIVE=1
timeout = 60
# Lets api tests `from conftest import assert_error, make_cases` (run pytest from tests/).
pythonpath = api
